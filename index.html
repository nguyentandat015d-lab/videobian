```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Are You Ready?</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle, #1c1c1c 0%, #050505 45%, #000 100%);
    color: white;
    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

/* Nhiễu màn hình */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );

    pointer-events: none;
    z-index: 100;
}

/* Vignette */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    box-shadow:
        inset 0 0 180px #000,
        inset 0 0 350px #000;

    pointer-events: none;
    z-index: 99;
}

.container {
    width: 92%;
    max-width: 900px;

    text-align: center;

    position: relative;
    z-index: 5;
}

.question {
    font-size: clamp(28px, 6vw, 64px);

    letter-spacing: 6px;

    text-shadow:
        0 0 5px white,
        0 0 15px #777,
        0 0 35px #444;

    animation: flicker 3s infinite;
}

.subtitle {
    margin-top: 18px;

    color: #666;

    font-size: 12px;

    letter-spacing: 4px;
}

.buttons {
    margin-top: 45px;

    display: flex;
    justify-content: center;

    gap: 20px;
}

button {
    width: 135px;

    padding: 15px;

    background: transparent;

    color: white;

    border: 1px solid #777;

    font-family: Georgia, serif;

    font-size: 17px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.4s;
}

button:hover {
    background: white;

    color: black;

    box-shadow: 0 0 30px white;

    transform: scale(1.08);
}

button:active {
    transform: scale(0.95);
}

/* Đếm ngược */
.countdown {
    display: none;

    font-size: clamp(80px, 20vw, 180px);

    font-weight: bold;

    letter-spacing: 10px;

    text-shadow:
        0 0 10px white,
        0 0 30px #aaa,
        0 0 70px #444;

    animation: countdownAnim 1s ease;
}

/* Video */
.video-box {
    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    justify-content: center;
    align-items: center;

    z-index: 50;

    animation: videoAppear 1.5s ease;
}

video {
    width: 100vw;
    height: 100vh;

    object-fit: contain;

    background: black;
}

/* Chớp màn hình */
.flash {
    display: none;

    position: fixed;

    inset: 0;

    background: white;

    z-index: 200;

    animation: flashEffect 0.15s ease;
}

/* Rung */
.shake {
    animation: shake 0.12s infinite;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes flicker {

    0%, 18%, 22%, 63%, 64%, 65%, 100% {
        opacity: 1;
    }

    19%, 21%, 62% {
        opacity: 0.45;
    }

}

@keyframes countdownAnim {

    0% {
        opacity: 0;
        transform: scale(2);
        filter: blur(10px);
    }

    100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

}

@keyframes videoAppear {

    from {
        opacity: 0;
        transform: scale(1.15);
        filter: blur(15px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

}

@keyframes flashEffect {

    0% {
        opacity: 0;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}

@keyframes shake {

    0% {
        transform: translate(0, 0);
    }

    25% {
        transform: translate(5px, -4px);
    }

    50% {
        transform: translate(-5px, 4px);
    }

    75% {
        transform: translate(4px, 5px);
    }

    100% {
        transform: translate(0, 0);
    }

}


/* Điện thoại */

@media (max-width: 600px) {

    .question {
        font-size: 30px;
        letter-spacing: 3px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
    }

    .buttons {
        gap: 12px;
    }

    button {
        width: 120px;
    }

}
</style>
</head>


<body>

<div class="flash" id="flash"></div>


<div class="container" id="container">

    <!-- Câu hỏi -->

    <div class="question" id="question">
        BẠN ĐÃ SẴN SÀNG CHƯA?
    </div>

    <div class="subtitle" id="subtitle">
        SOME THINGS ARE BETTER LEFT UNKNOWN
    </div>


    <!-- Nút -->

    <div class="buttons" id="buttons">

        <button onclick="startExperience()">
            YES
        </button>

        <button onclick="startExperience()">
            NO
        </button>

    </div>


    <!-- Đếm ngược -->

    <div class="countdown" id="countdown">
        3
    </div>

</div>


<!-- Video -->

<div class="video-box" id="videoBox">

    <video
        id="myVideo"
        controls
        playsinline
        preload="auto">

        <source src="video.mp4" type="video/mp4">

        Trình duyệt của bạn không hỗ trợ video.

    </video>

</div>


<script>

function startExperience() {

    const question =
        document.getElementById("question");

    const subtitle =
        document.getElementById("subtitle");

    const buttons =
        document.getElementById("buttons");

    const countdown =
        document.getElementById("countdown");

    const container =
        document.getElementById("container");

    const videoBox =
        document.getElementById("videoBox");

    const video =
        document.getElementById("myVideo");

    const flash =
        document.getElementById("flash");


    /* Ẩn giao diện */

    question.style.display = "none";

    subtitle.style.display = "none";

    buttons.style.display = "none";


    /* Hiện số 3 */

    countdown.style.display = "block";

    countdown.innerText = "3";


    setTimeout(() => {

        countdown.innerText = "2";

    }, 1000);


    setTimeout(() => {

        countdown.innerText = "1";

    }, 2000);


    setTimeout(() => {

        countdown.innerText = "0";

        container.classList.add("shake");


        /* Chớp màn hình */

        flash.style.display = "block";


        setTimeout(() => {

            flash.style.display = "none";

        }, 150);


    }, 3000);


    /* Sau đếm ngược mở video */

    setTimeout(() => {

        container.style.display = "none";

        videoBox.style.display = "flex";


        /* Phát video */

        video.play().catch(() => {});


        /* Fullscreen */

        if (video.requestFullscreen) {

            video.requestFullscreen().catch(() => {});

        }

        else if (video.webkitEnterFullscreen) {

            video.webkitEnterFullscreen();

        }

    }, 3200);

}

</script>

</body>
</html>
```
