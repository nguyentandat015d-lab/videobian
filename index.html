```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bạn đã sẵn sàng chưa?</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #252525 0%, #090909 45%, #000000 100%);
    color: white;
    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

/* Hiệu ứng nhiễu */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );

    pointer-events: none;
    z-index: 10;
}

/* Khung chính */
.container {
    width: 92%;
    max-width: 800px;

    text-align: center;

    animation: appear 2s ease;
}

/* Tiêu đề */
.question {
    font-size: clamp(28px, 6vw, 60px);

    letter-spacing: 5px;

    text-transform: uppercase;

    text-shadow:
        0 0 5px white,
        0 0 15px #777,
        0 0 35px #333;

    animation: flicker 3s infinite;
}

/* Dòng nhỏ */
.subtitle {
    margin-top: 18px;

    color: #777;

    font-size: 13px;

    letter-spacing: 3px;
}

/* Hai nút */
.buttons {
    margin-top: 45px;

    display: flex;

    justify-content: center;

    gap: 20px;
}

button {
    width: 130px;

    padding: 15px 20px;

    background: transparent;

    color: white;

    border: 1px solid #777;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        background 0.4s,
        color 0.4s,
        box-shadow 0.4s,
        transform 0.4s;
}

button:hover {
    background: white;

    color: black;

    box-shadow: 0 0 30px white;

    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}

/* Video */
.video-box {
    display: none;

    margin-top: 40px;

    animation: videoAppear 2s ease;
}

video {
    display: block;

    width: 100%;

    max-height: 80vh;

    background: black;

    border: 1px solid #555;

    box-shadow:
        0 0 20px rgba(255,255,255,0.12),
        0 0 70px rgba(0,0,0,0.9);
}

/* Dòng dưới video */
.back-text {
    margin-top: 15px;

    color: #555;

    font-size: 12px;

    letter-spacing: 3px;
}

/* Hiệu ứng xuất hiện */
@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* Hiệu ứng video */
@keyframes videoAppear {

    from {
        opacity: 0;
        transform: scale(0.90);
        filter: blur(10px);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

}

/* Nhấp nháy chữ */
@keyframes flicker {

    0%,
    18%,
    22%,
    63%,
    64%,
    65%,
    100% {
        opacity: 1;
    }

    19%,
    21%,
    62% {
        opacity: 0.5;
    }

}

/* Điện thoại */
@media (max-width: 600px) {

    .question {
        font-size: 30px;

        letter-spacing: 3px;
    }

    .subtitle {
        font-size: 11px;

        letter-spacing: 2px;
    }

    .buttons {
        gap: 12px;

        margin-top: 35px;
    }

    button {
        width: 120px;

        padding: 14px 10px;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- Câu hỏi -->
    <div class="question">
        BẠN ĐÃ SẴN SÀNG CHƯA?
    </div>

    <!-- Dòng phụ -->
    <div class="subtitle">
        SOME THINGS ARE BETTER LEFT UNKNOWN
    </div>

    <!-- Nút -->
    <div class="buttons">

        <button onclick="showVideo()">
            YES
        </button>

        <button onclick="showVideo()">
            NO
        </button>

    </div>

    <!-- Video -->
    <div class="video-box" id="videoBox">

        <video
            id="myVideo"
            controls
            playsinline
            preload="auto">

            <source src="video.mp4" type="video/mp4">

            Trình duyệt của bạn không hỗ trợ video.

        </video>

        <div class="back-text">
            YOU WERE WARNED.
        </div>

    </div>

</div>


<script>

function showVideo() {

    const videoBox =
        document.getElementById("videoBox");

    const video =
        document.getElementById("myVideo");


    /* Hiện video */

    videoBox.style.display = "block";


    /*
        Cố gắng phát video.
        Vì người dùng vừa bấm YES/NO
        nên trình duyệt thường cho phép.
    */

    video.play().catch(function(error) {

        console.log("Không thể tự phát:", error);

    });


    /*
        Chuyển video sang fullscreen.
    */

    if (video.requestFullscreen) {

        video.requestFullscreen().catch(function(error) {

            console.log("Fullscreen bị trình duyệt chặn:", error);

        });

    }

    /*
        Hỗ trợ một số trình duyệt Safari/iPhone.
    */

    else if (video.webkitEnterFullscreen) {

        video.webkitEnterFullscreen();

    }

}

</script>

</body>
</html>
```
